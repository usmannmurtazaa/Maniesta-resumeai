[build]
  command = "npm run build"
  publish = "dist"
  environment = { SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_PROJECT_ID", SECRETS_SCAN_OMIT_PATHS = ".firebaserc,package-lock.json,package.json" }

[functions]
  directory = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 8080
  targetPort = 5173
  framework = "#custom"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200